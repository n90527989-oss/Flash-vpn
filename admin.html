<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>پنل مدیریت</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('th')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.ad{max-width:980px;margin:0 auto;padding:18px 16px 60px}
.ad h1{font-size:1.5rem;margin:0}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.nav button[aria-pressed=true]{background:var(--gd);color:var(--ai);border-color:transparent;font-weight:800}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kp .card{padding:14px 16px}.kp small{color:var(--mu)}.kp b{display:block;font:800 1.5rem Inter,sans-serif;direction:ltr;text-align:right}
.it{padding:16px;margin-bottom:12px}
.it .r{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.it label{display:block;color:var(--mu);font-size:.85rem;margin:8px 0 3px}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:6px;margin-top:8px}.ck input{width:auto}
.lg2{max-width:380px;margin:12vh auto;padding:26px}
.err{color:var(--dn,#ff6b5f);min-height:1.5em}
.sm{padding:5px 12px;font-size:.85rem}
.log{font:12px/1.7 Inter,monospace;direction:ltr;text-align:left;color:var(--mu);word-break:break-all}
code{direction:ltr;display:inline-block;user-select:all;word-break:break-all}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<script src="admin.js"></script>
</body>
</html>
